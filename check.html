<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>系統自我檢查 · 尤尤的動物樂園</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .test { display: flex; justify-content: space-between; align-items: center; padding: 12px 4px; border-bottom: 1px dashed var(--line); }
    .st { font-weight: 800; }
    .ok { color: var(--green); } .bad { color: var(--red); } .wait { color: var(--dim); }
  </style>
</head>
<body>
  <div id="meadow"></div>
  <div id="app" style="max-width:560px">
    <h1 style="margin:20px 0 6px">🔧 系統自我檢查</h1>
    <p class="dim small" style="margin-bottom:14px">部署完成後，在這頁按「開始檢查」，逐項確認網站正常。</p>
    <div class="card">
      <input type="password" id="code" placeholder="家庭代碼">
      <button class="btn block" id="run" style="margin-top:10px">開始檢查</button>
    </div>
    <div class="card" id="results"></div>
    <p class="small dim">全部 ✓ 就代表一切就緒。如有 ✗，請對照《部署指南》的常見問題部分。</p>
    <p><a href="index.html" style="color:#d9701e">← 返回主頁</a></p>
  </div>

  <script src="js/hanzi-writer.min.js"></script>
  <script src="js/strokes.js"></script>
  <script src="js/data.js"></script>
  <script>
    var TESTS = [
      "① 家庭代碼登入（/api/login）",
      "② 雲端資料庫讀寫（Netlify Blobs）",
      "③ 進度存檔（讀取）",
      "④ 相片上載／下載／刪除",
      "⑤ 筆順數據（覆蓋全部核心字）",
      "⑥ 筆順引擎（Hanzi Writer）",
      "⑦ 朗讀聲音（中文語音）"
    ];
    var results = document.getElementById("results");
    function draw(states) {
      results.innerHTML = TESTS.map(function (t, i) {
        var s = states[i] || "wait";
        var mark = s === "ok" ? "✓" : (s === "bad" ? "✗" : "…");
        return '<div class="test"><span>' + t + '</span><span class="st ' + s + '">' + mark + '</span></div>';
      }).join("");
    }
    var states = [];
    draw(states);

    function api(path, method, body, code) {
      return fetch(path, {
        method: method || "GET",
        headers: { "Content-Type": "application/json", "x-family-code": code },
        body: body ? JSON.stringify(body) : undefined
      }).then(function (r) { return r.json().then(function (d) { d._status = r.status; return d; }); });
    }

    document.getElementById("run").addEventListener("click", function () {
      var code = document.getElementById("code").value.trim();
      states = [];
      draw(states);
      if (!code) { alert("請輸入家庭代碼"); return; }

      // ① login
      api("/api/login", "POST", { code: code }, code).then(function (d) {
        states[0] = d.ok ? "ok" : "bad"; draw(states);
        if (!d.ok) { if (d.message) alert(d.message); return; }

        // ② ping (blobs)
        api("/api/ping", "GET", null, code).then(function (p) {
          states[1] = p.ok ? "ok" : "bad"; draw(states);
        }).catch(function () { states[1] = "bad"; draw(states); });

        // ③ save read
        api("/api/save", "GET", null, code).then(function (s) {
          states[2] = s.ok ? "ok" : "bad"; draw(states);
        }).catch(function () { states[2] = "bad"; draw(states); });

        // ④ image roundtrip
        var tiny = "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDL/wAALCAABAAEBAREA/8QAFAABAAAAAAAAAAAAAAAAAAAACf/EABQQAQAAAAAAAAAAAAAAAAAAAAD/2gAIAQEAAD8AKp//2Q==";
        api("/api/image", "POST", { key: "selftest", dataUrl: tiny }, code).then(function (u) {
          if (!u.ok) throw 0;
          return api("/api/image?key=selftest", "GET", null, code);
        }).then(function (g) {
          if (!g.ok) throw 0;
          return api("/api/image?key=selftest", "DELETE", null, code);
        }).then(function () {
          states[3] = "ok"; draw(states);
        }).catch(function () { states[3] = "bad"; draw(states); });
      }).catch(function () { states[0] = "bad"; draw(states); });

      // ⑤ stroke data：逐個核心字對照 strokes.js
      (function () {
        var miss = [];
        try {
          window.APP_DATA.chapters.forEach(function (c) { c.words.forEach(function (w) { w.w.split("").forEach(function (ch) {
            if (!(window.STROKES && window.STROKES[ch]) && miss.indexOf(ch) < 0) miss.push(ch);
          }); }); });
        } catch (e) { miss = ["載入失敗"]; }
        states[4] = miss.length === 0 ? "ok" : "bad";
        draw(states);
        if (miss.length) alert("以下字缺筆順數據，請把最新 strokes.js 上載到 public/js/：\n" + miss.join("、"));
      })();

      // ⑥ hanzi writer lib
      states[5] = (window.HanziWriter && typeof HanziWriter.create === "function") ? "ok" : "bad";
      draw(states);

      // ⑦ speech voices
      function checkVoices(tries) {
        var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
        var hasZh = vs.some(function (v) { return /^zh/i.test(v.lang); });
        if (hasZh) { states[6] = "ok"; draw(states); return; }
        if (tries > 0) setTimeout(function () { checkVoices(tries - 1); }, 500);
        else { states[6] = window.speechSynthesis ? "bad" : "bad"; draw(states); }
      }
      checkVoices(6);
    });
  </script>
</body>
</html>
